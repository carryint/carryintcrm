<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Carryint CRM & Invoicing v1.2.2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html {
      font-size: 14.5px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* Prevent mobile browser & iOS Safari auto-zoom on input focus / typing */
    @media screen and (max-width: 768px) {
      input,
      select,
      textarea {
        font-size: 16px !important;
      }
    }

    /* Sleek Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f131a;
    }
    ::-webkit-scrollbar-thumb {
      background: #f97316;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ea580c;
    }
    /* Smooth Dark Charcoal, Slate Grey, Warm Orange, Peach & Golden-Yellow Gradient Background with Ambient Lighting */
    .crm-black-orange-bg {
      background: 
        radial-gradient(circle at 14% 15%, rgba(249, 115, 22, 0.25) 0%, rgba(234, 88, 12, 0.10) 30%, transparent 58%),
        radial-gradient(circle at 86% 18%, rgba(245, 158, 11, 0.20) 0%, rgba(251, 191, 36, 0.08) 32%, transparent 55%),
        radial-gradient(circle at 50% 28%, rgba(253, 186, 116, 0.14) 0%, rgba(251, 146, 60, 0.06) 36%, transparent 62%),
        radial-gradient(circle at 18% 82%, rgba(234, 88, 12, 0.16) 0%, rgba(249, 115, 22, 0.06) 30%, transparent 55%),
        radial-gradient(circle at 82% 82%, rgba(217, 119, 6, 0.14) 0%, rgba(245, 158, 11, 0.05) 34%, transparent 56%),
        linear-gradient(140deg, #080a10 0%, #0e121b 20%, #131822 42%, #191420 65%, #10141d 84%, #080a10 100%);
      background-attachment: fixed;
    }

    /* Global Text Sharpness & Anti-Blur Optimization */
    html, body, button, input, select, textarea, p, span, h1, h2, h3, h4, h5, h6, div {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* 3D Depth, Perspective & Interactive Tactile Feedback - Zero Text Blurring */
    .perspective-container {
      perspective: none !important;
    }

    /* ─────────────────────────────────────────────────────────────
       EXECUTIVE OBSIDIAN GLASSMORPHISM - LUXURIOUS DARK SHADE PANELS
       Dark smoked obsidian glass, realistic specular rim, soft depth
       ───────────────────────────────────────────────────────────── */
    .glass-ultra {
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.07) 0%,
        rgba(255, 255, 255, 0.02) 18%,
        rgba(20, 24, 33, 0.85) 42%,
        rgba(10, 13, 19, 0.95) 100%
      ) !important;
      backdrop-filter: blur(36px) saturate(190%) !important;
      -webkit-backdrop-filter: blur(36px) saturate(190%) !important;
      border: 1px solid rgba(255, 255, 255, 0.13) !important;
      border-top: 1px solid rgba(255, 255, 255, 0.42) !important;
      border-left: 1px solid rgba(255, 255, 255, 0.22) !important;
      box-shadow: 
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.22),
        inset 0 -1px 1px 0 rgba(0, 0, 0, 0.70),
        0 20px 50px -10px rgba(0, 0, 0, 0.85),
        0 0 1px 1px rgba(255, 255, 255, 0.04) !important;
      transform: none !important;
    }

    .glass-ultra:hover {
      border-color: rgba(255, 255, 255, 0.25) !important;
      border-top-color: rgba(255, 255, 255, 0.70) !important;
      box-shadow: 
        inset 0 1px 2px 0 rgba(255, 255, 255, 0.35),
        inset 0 -1px 1px 0 rgba(0, 0, 0, 0.75),
        0 25px 60px -10px rgba(0, 0, 0, 0.92),
        0 0 30px rgba(249, 115, 22, 0.15) !important;
    }

    /* Specular glass reflection layer (diagonal optical sheen) */
    .glass-sheen {
      position: relative;
    }
    .glass-sheen::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40%;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.05) 0%,
        rgba(255, 255, 255, 0.0) 100%
      );
      border-top-left-radius: inherit;
      border-top-right-radius: inherit;
      pointer-events: none;
      z-index: 1;
    }

    /* Frosted glass capsule pill badge / button */
    .glass-pill {
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.09) 0%,
        rgba(255, 255, 255, 0.02) 40%,
        rgba(16, 20, 28, 0.82) 100%
      ) !important;
      backdrop-filter: blur(24px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
      border: 1px solid rgba(255, 255, 255, 0.14) !important;
      border-top: 1px solid rgba(255, 255, 255, 0.38) !important;
      box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.18), 0 8px 20px rgba(0, 0, 0, 0.55) !important;
      transform: none !important;
    }

    .glass-pill:hover {
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.14) 0%,
        rgba(255, 255, 255, 0.04) 40%,
        rgba(24, 30, 42, 0.88) 100%
      ) !important;
      border-color: rgba(255, 255, 255, 0.30) !important;
      border-top-color: rgba(255, 255, 255, 0.60) !important;
      box-shadow: inset 0 1px 2px 0 rgba(255, 255, 255, 0.28), 0 12px 25px rgba(0, 0, 0, 0.65) !important;
    }

    /* Razor-Sharp Tactile Card - Zero Text Blurring on Hover or Mouse Scroll */
    .card-3d {
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      transform: none !important;
    }

    .card-3d:hover {
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.85), 0 0 25px rgba(249, 115, 22, 0.16) !important;
      border-color: rgba(255, 255, 255, 0.28) !important;
    }

    .card-3d:active {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.90) !important;
    }

    /* Scrawling / Laser Light Shimmer Beam */
    @keyframes crawl-beam {
      0% {
        transform: translateX(-150%);
      }
      50% {
        transform: translateX(150%);
      }
      100% {
        transform: translateX(300%);
      }
    }

    .scrawl-beam-wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      border-radius: inherit;
      z-index: 5;
    }

    .scrawl-beam {
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(249, 115, 22, 0.9), rgba(254, 215, 170, 1), rgba(249, 115, 22, 0.9), transparent);
      animation: crawl-beam 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      box-shadow: 0 0 14px rgba(249, 115, 22, 0.95);
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.06); }
    }

    .animate-pulse-glow {
      animation: pulse-glow 5s ease-in-out infinite;
    }

    @keyframes rotate-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animate-rotate-slow {
      animation: rotate-slow 20s linear infinite;
    }


    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Slim Sleek Scrollbar for Sidebar & Modals on Short Screens & Mobile */
    .sidebar-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .sidebar-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .sidebar-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 4px;
    }
    .sidebar-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(249, 115, 22, 0.55);
    }

    /* Short screen height optimizations (e.g. laptops <= 780px height, mobile landscape) */
    @media screen and (max-height: 780px) {
      .short-screen-compact {
        padding-top: 0.35rem !important;
        padding-bottom: 0.35rem !important;
        min-height: 36px !important;
      }
      .short-screen-header {
        padding-top: 0.5rem !important;
        padding-bottom: 0.5rem !important;
      }
      .short-screen-footer {
        padding-top: 0.5rem !important;
        padding-bottom: 0.5rem !important;
      }
    }
    
    /* High contrast text readability for forms, inputs, and cards */
    input, select, textarea {
      color: #0f172a;
    }
    header input,
    .dark-glass-input,
    [class*="text-white"] input:not([class*="text-slate-"]):not([class*="text-gray-"]):not([class*="text-black"]) {
      color: #ffffff;
    }
    .bg-white, .bg-gray-50, .bg-slate-50, .bg-amber-50, .bg-amber-100 {
      color: #0f172a;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm 10mm;
      }

      .no-print {
        display: none !important;
      }

      .print-only {
        display: block !important;
      }

      html, body {
        padding: 0 !important;
        margin: 0 !important;
        background: white !important;
        width: 100% !important;
        font-size: 11px !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        overflow: visible !important;
      }

      #root, #root > div {
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        min-height: auto !important;
        overflow: visible !important;
      }

      /* Reset app wrapper layout for print - kill sidebar offset & container padding */
      main,
      main.lg\:pl-64,
      [class*="lg:pl-"],
      [class*="pl-64"],
      main > div {
        padding: 0 !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
        padding-top: 0 !important;
        padding-bottom: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        position: static !important;
        left: 0 !important;
        top: 0 !important;
        background: white !important;
        overflow: visible !important;
      }

      .invoice-container, .receipt-container, .quotation-container, .soa-container {
        margin: 0 auto !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
        max-width: 100% !important;
        width: 100% !important;
        background: white !important;
        box-sizing: border-box !important;
      }

      /* Allow multi-page statements to break cleanly between pages without squishing */
      .soa-container {
        page-break-inside: auto !important;
      }

      .receipt-container, .quotation-container {
        page-break-inside: avoid !important;
      }

      tr {
        page-break-inside: avoid !important;
      }

      thead {
        display: table-header-group !important;
      }

      tfoot {
        display: table-footer-group !important;
      }

      /* Perfectly align SOA tables within A4 margins */
      .soa-container table {
        width: 100% !important;
        min-width: 100% !important;
        max-width: 100% !important;
        table-layout: auto !important;
        border-collapse: collapse !important;
      }

      .soa-container table th,
      .soa-container table td {
        padding: 6px 8px !important;
        font-size: 10px !important;
        line-height: 1.35 !important;
        vertical-align: middle !important;
      }

      .soa-container .max-w-xs {
        max-width: 100% !important;
      }

      /* Print Layout Overrides for Mobile & Desktop */
      .print-flex-row {
        display: flex !important;
        flex-direction: row !important;
        justify-content: space-between !important;
        align-items: flex-end !important;
      }

      .print-flex-between-start {
        display: flex !important;
        flex-direction: row !important;
        justify-content: space-between !important;
        align-items: flex-start !important;
      }

      .print-grid-2 {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 1.5rem !important;
      }

      .print-grid-3 {
        display: grid !important;
        grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
        gap: 0.75rem !important;
      }

      .print-text-right {
        text-align: right !important;
      }

      .print-text-left {
        text-align: left !important;
      }

      .print-text-center {
        text-align: center !important;
      }

      .print-ml-auto {
        margin-left: auto !important;
        margin-right: 0 !important;
      }

      .print-items-end {
        align-items: flex-end !important;
      }

      .print-items-start {
        align-items: flex-start !important;
      }

      .print-w-auto {
        width: auto !important;
      }

      .print-w-64 {
        width: 16rem !important;
      }

      .print-h-14 {
        height: 3.5rem !important;
      }

      .print-overflow-visible {
        overflow: visible !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
      }

      table {
        width: 100% !important;
        min-width: 100% !important;
        table-layout: auto !important;
      }
    }

    .print-only {
      display: none;
    }
  </style>

  <script type="module" crossorigin src="./assets/index-DWaDlc7R.js"></script>
</head>

<body class="crm-black-orange-bg text-white min-h-screen">
  <div id="root"></div>
