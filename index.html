<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Carryint CRM & Invoicing v1.2.2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html {
      font-size: 14.5px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* Prevent mobile browser & iOS Safari auto-zoom on input focus / typing */
    @media screen and (max-width: 768px) {
      input,
      select,
      textarea {
        font-size: 16px !important;
      }
    }

    /* Sleek Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm;
      }

      .no-print {
        display: none !important;
      }

      .print-only {
        display: block !important;
      }

      html, body {
        padding: 0 !important;
        margin: 0 !important;
        background: white !important;
        width: 100% !important;
        font-size: 11.5px !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Reset app wrapper layout for print */
      main {
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        position: static !important;
        left: auto !important;
        top: auto !important;
      }

      .invoice-container, .receipt-container, .quotation-container {
        margin: 0 auto !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
        max-width: 100% !important;
        width: 100% !important;
        page-break-inside: avoid !important;
        background: white !important;
      }

      /* Print Layout Overrides for Mobile & Desktop */
      .print-flex-row {
        display: flex !important;
        flex-direction: row !important;
        justify-content: space-between !important;
        align-items: flex-end !important;
      }

      .print-flex-between-start {
        display: flex !important;
        flex-direction: row !important;
        justify-content: space-between !important;
        align-items: flex-start !important;
      }

      .print-grid-2 {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 1.5rem !important;
      }

      .print-grid-3 {
        display: grid !important;
        grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
        gap: 0.75rem !important;
      }

      .print-text-right {
        text-align: right !important;
      }

      .print-text-left {
        text-align: left !important;
      }

      .print-text-center {
        text-align: center !important;
      }

      .print-ml-auto {
        margin-left: auto !important;
        margin-right: 0 !important;
      }

      .print-items-end {
        align-items: flex-end !important;
      }

      .print-items-start {
        align-items: flex-start !important;
      }

      .print-w-auto {
        width: auto !important;
      }

      .print-w-64 {
        width: 16rem !important;
      }

      .print-h-14 {
        height: 3.5rem !important;
      }

      .print-overflow-visible {
        overflow: visible !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
      }

      table {
        width: 100% !important;
        min-width: 100% !important;
        table-layout: auto !important;
      }
    }

    .print-only {
      display: none;
    }
  </style>

</head>

<body class="bg-gray-50 text-gray-900">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
