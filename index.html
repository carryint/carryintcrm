<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Carryint CRM & Invoicing v1.2.2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html {
      font-size: 14.5px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* Prevent mobile browser & iOS Safari auto-zoom on input focus / typing */
    @media screen and (max-width: 768px) {
      input,
      select,
      textarea {
        font-size: 16px !important;
      }
    }

    /* Sleek Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #06070a;
    }
    ::-webkit-scrollbar-thumb {
      background: #2a150c;
      border-radius: 4px;
      border: 1px solid rgba(234, 88, 12, 0.3);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ea580c;
    }
    /* CRM Black & Orange Deep Gradient Background */
    .crm-black-orange-bg {
      background: 
        radial-gradient(circle at 10% 15%, rgba(234, 88, 12, 0.22) 0%, transparent 40%),
        radial-gradient(circle at 90% 25%, rgba(194, 65, 12, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(249, 115, 22, 0.14) 0%, transparent 50%),
        radial-gradient(circle at 80% 90%, rgba(154, 52, 18, 0.15) 0%, transparent 40%),
        linear-gradient(145deg, #040507 0%, #0d0705 30%, #170b05 60%, #06070a 100%);
      background-attachment: fixed;
    }

    /* 3D Depth, Perspective & Interactive Tactile Feedback */
    .perspective-container {
      perspective: 1200px;
    }

    
    /* ─────────────────────────────────────────────────────────────
       HYPER-REALISTIC GLASSMORPHISM DESIGN SYSTEM
       ───────────────────────────────────────────────────────────── */
    .glass-ultra {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(255, 255, 255, 0.02) 25%,
        rgba(10, 10, 18, 0.5) 65%,
        rgba(0, 0, 0, 0.75) 100%
      ) !important;
      backdrop-filter: blur(32px) saturate(190%) !important;
      -webkit-backdrop-filter: blur(32px) saturate(190%) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-top: 1px solid rgba(255, 255, 255, 0.35) !important;
      border-left: 1px solid rgba(255, 255, 255, 0.22) !important;
      box-shadow: 
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.25),
        inset 0 -1px 2px 0 rgba(0, 0, 0, 0.5),
        0 20px 50px -10px rgba(0, 0, 0, 0.85),
        0 0 30px 0 rgba(234, 88, 12, 0.14) !important;
    }

    .glass-ultra:hover {
      border-color: rgba(249, 115, 22, 0.45) !important;
      border-top-color: rgba(254, 215, 170, 0.65) !important;
      box-shadow: 
        inset 0 1px 2px 0 rgba(255, 255, 255, 0.35),
        inset 0 -1px 2px 0 rgba(0, 0, 0, 0.6),
        0 25px 60px -10px rgba(0, 0, 0, 0.95),
        0 0 40px 0 rgba(234, 88, 12, 0.28) !important;
    }

    /* Specular glass reflection layer (diagonal optical sheen) */
    .glass-sheen {
      position: relative;
    }
    .glass-sheen::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48%;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.09) 0%,
        rgba(255, 255, 255, 0.0) 100%
      );
      border-top-left-radius: inherit;
      border-top-right-radius: inherit;
      pointer-events: none;
      z-index: 2;
    }

    /* Frosted glass capsule pill badge / button */
    .glass-pill {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.14) 0%,
        rgba(255, 255, 255, 0.04) 100%
      ) !important;
      backdrop-filter: blur(18px) saturate(160%) !important;
      -webkit-backdrop-filter: blur(18px) saturate(160%) !important;
      border: 1px solid rgba(255, 255, 255, 0.18) !important;
      border-top: 1px solid rgba(255, 255, 255, 0.38) !important;
      box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.25) !important;
    }

    .glass-pill:hover {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(255, 255, 255, 0.08) 100%
      ) !important;
      border-color: rgba(255, 255, 255, 0.35) !important;
      border-top-color: rgba(255, 255, 255, 0.6) !important;
      box-shadow: 
        inset 0 1px 2px 0 rgba(255, 255, 255, 0.35),
        0 8px 20px rgba(0, 0, 0, 0.4) !important;
    }

    .card-3d {
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease;
      transform-style: preserve-3d;
      will-change: transform, box-shadow;
    }

    .card-3d:hover {
      transform: translateY(-6px) scale(1.012);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 35px rgba(234, 88, 12, 0.28);
    }

    .card-3d:active {
      transform: translateY(-1px) scale(0.975);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.95), 0 0 15px rgba(234, 88, 12, 0.2);
    }

    /* Scrawling / Laser Light Shimmer Beam */
    @keyframes crawl-beam {
      0% {
        transform: translateX(-150%);
      }
      50% {
        transform: translateX(150%);
      }
      100% {
        transform: translateX(300%);
      }
    }

    .scrawl-beam-wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      border-radius: inherit;
      z-index: 5;
    }

    .scrawl-beam {
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(249, 115, 22, 0.9), rgba(254, 215, 170, 1), rgba(249, 115, 22, 0.9), transparent);
      animation: crawl-beam 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      box-shadow: 0 0 14px rgba(249, 115, 22, 0.95);
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.06); }
    }

    .animate-pulse-glow {
      animation: pulse-glow 5s ease-in-out infinite;
    }

    @keyframes rotate-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animate-rotate-slow {
      animation: rotate-slow 20s linear infinite;
    }


    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    
    /* High contrast text readability for forms, inputs, and cards */
    input, select, textarea {
      color: #0f172a;
    }
    header input,
    .dark-glass-input,
    [class*="text-white"] input:not([class*="text-slate-"]):not([class*="text-gray-"]):not([class*="text-black"]) {
      color: #ffffff;
    }
    .bg-white, .bg-gray-50, .bg-slate-50, .bg-amber-50, .bg-amber-100 {
      color: #0f172a;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm 10mm;
      }

      .no-print {
        display: none !important;
      }

      .print-only {
        display: block !important;
      }

      html, body {
        padding: 0 !important;
        margin: 0 !important;
        background: white !important;
        width: 100% !important;
        font-size: 11px !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        overflow: visible !important;
      }

      #root, #root > div {
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        min-height: auto !important;
        overflow: visible !important;
      }

      /* Reset app wrapper layout for print - kill sidebar offset & container padding */
      main,
      main.lg\:pl-64,
      [class*="lg:pl-"],
      [class*="pl-64"],
      main > div {
        padding: 0 !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
        padding-top: 0 !important;
        padding-bottom: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        position: static !important;
        left: 0 !important;
        top: 0 !important;
        background: white !important;
        overflow: visible !important;
      }

      .invoice-container, .receipt-container, .quotation-container, .soa-container {
        margin: 0 auto !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
        max-width: 100% !important;
        width: 100% !important;
        background: white !important;
        box-sizing: border-box !important;
      }

      /* Allow multi-page statements to break cleanly between pages without squishing */
      .soa-container {
        page-break-inside: auto !important;
      }

      .receipt-container, .quotation-container {
        page-break-inside: avoid !important;
      }

      tr {
        page-break-inside: avoid !important;
      }

      thead {
        display: table-header-group !important;
      }

      tfoot {
        display: table-footer-group !important;
      }

      /* Perfectly align SOA tables within A4 margins */
      .soa-container table {
        width: 100% !important;
        min-width: 100% !important;
        max-width: 100% !important;
        table-layout: auto !important;
        border-collapse: collapse !important;
      }

      .soa-container table th,
      .soa-container table td {
        padding: 6px 8px !important;
        font-size: 10px !important;
        line-height: 1.35 !important;
        vertical-align: middle !important;
      }

      .soa-container .max-w-xs {
        max-width: 100% !important;
      }

      /* Print Layout Overrides for Mobile & Desktop */
      .print-flex-row {
        display: flex !important;
        flex-direction: row !important;
        justify-content: space-between !important;
        align-items: flex-end !important;
      }

      .print-flex-between-start {
        display: flex !important;
        flex-direction: row !important;
        justify-content: space-between !important;
        align-items: flex-start !important;
      }

      .print-grid-2 {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 1.5rem !important;
      }

      .print-grid-3 {
        display: grid !important;
        grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
        gap: 0.75rem !important;
      }

      .print-text-right {
        text-align: right !important;
      }

      .print-text-left {
        text-align: left !important;
      }

      .print-text-center {
        text-align: center !important;
      }

      .print-ml-auto {
        margin-left: auto !important;
        margin-right: 0 !important;
      }

      .print-items-end {
        align-items: flex-end !important;
      }

      .print-items-start {
        align-items: flex-start !important;
      }

      .print-w-auto {
        width: auto !important;
      }

      .print-w-64 {
        width: 16rem !important;
      }

      .print-h-14 {
        height: 3.5rem !important;
      }

      .print-overflow-visible {
        overflow: visible !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
      }

      table {
        width: 100% !important;
        min-width: 100% !important;
        table-layout: auto !important;
      }
    }

    .print-only {
      display: none;
    }
  </style>

  <script type="module" crossorigin src="./assets/index-CVLQV28B.js"></script>
</head>

<body class="crm-black-orange-bg text-gray-900 min-h-screen">
  <div id="root"></div>
</body>

</html>
